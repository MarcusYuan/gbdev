name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - name: Use an isolated npm cache
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/gbdev-npm-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: node scripts/gen-roles.mjs --check
      - name: Test with isolated user state
        run: |
          mkdir -p "$RUNNER_TEMP/gbdev-home"
          HOME="$RUNNER_TEMP/gbdev-home" npm test
